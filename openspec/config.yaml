schema: spec-driven

context: |
  Language: Vietnamese (vi)
  Tất cả OpenSpec artifacts (proposal, design, tasks, spec deltas) phải viết bằng tiếng Việt.
  Giữ nguyên tiếng Anh cho:
  - Thuật ngữ kỹ thuật: API, REST, SSE, JWT, CRUD, ORM, UI, UX...
  - Tên code: class, function, variable, type, enum, file path
  - Code examples và comments trong code block
  - Tên framework/thư viện: Next.js, React, TypeScript, Tailwind CSS, Vitest, Testing Library
  - Git terminology: branch, merge, commit, PR

  Project: WISMO Frontend
  Tech stack: Next.js 15, React 19, TypeScript, Tailwind CSS
  Package manager: npm

  Frontend workflow rules:
  - Worker chỉ đọc các spec files được liệt kê trong proposal/design "Spec References".
  - Không load toàn bộ specs folder nếu change đã chỉ rõ spec refs.
  - Components là presentation-first: nhận props để render, không tự fetch data.
  - API calls nằm trong hooks hoặc client/lib layer.
  - User-facing copy phải bám spec, không tự viết lại safety/consent/disclaimer text.

  Frontend spec focus:
  - product/spec.md
  - ui-layout/spec.md
  - chat-ux/spec.md
  - auth-flow/spec.md
  - consent-screen/spec.md
  - crisis-display/spec.md
  - api-contracts/spec.md

  Mandatory interpretation:
  - Consent copy đọc từ consent-screen/spec.md.
  - Crisis/hotline display đọc từ crisis-display/spec.md.
  - SSE events và API request/response shapes đọc từ api-contracts/spec.md.
  - Không tự suy diễn event shape hoặc rewrite canonical copy nếu spec đã định nghĩa.